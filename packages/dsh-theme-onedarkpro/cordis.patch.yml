# dsh-theme-onedarkpro bundle patch: mounts the theme plugin into the host
# composition of a dsh profile. There is no host logic: the web client half
# (dsh.client entry) stacks the One Dark Pro palette over the dark scheme
# of the --dsw-* token sheets through the theme service's override layer.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command pnpm-installs the package into the profile
# and reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: dsh-theme-onedarkpro
      name: dsh-theme-onedarkpro
